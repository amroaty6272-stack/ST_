<style>

:root{--bg:#050403;--panel:#120e0c;--line:#2e231c;--text:#efe6df;--muted:#a2928a;--accent:#c8834a;--on-accent:#050403;--teal:#e0a46f;
box-sizing:border-box;padding-top:env(safe-ara-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:Tajawal,Tahoma,Arial,sans-serif;line-height:1.8}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{max-width:1000px;margin:auto;padding:12px 20px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.logo{font-weight:800;font-size:20px;margin-inline-end:auto}
.bar a.l{color:var(--muted);font-weight:500}
.bar a.l:hover{color:var(--text)}
.btn{background:var(--accent);color:var(--on-accent);font-weight:700;padding:8px 18px;border-radius:6px;display:inline-block}
section{max-width:1000px;margin:auto;padding:56px 20px 8px}
h1{font-size:clamp(34px,7vw,60px);line-height:1.25;margin:0 0 14px;font-weight:800}
h2{font-size:28px;margin:0 0 6px}
.sub{color:var(--muted);margin:0 0 26px;max-width:60ch}
.hero{padding-top:72px}
.hero .row{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
button.ghost{background:none;color:var(--text);font:inherit;font-weight:500;cursor:pointer}
.ghost{border:1px solid var(--line);padding:8px 18px;border-radius:6px;font-weight:500}
.ip{display:inline-block;margin-top:22px;border-inline-start:3px solid var(--accent);padding:4px 14px;direction:ltr;font-family:Consolas,monospace;color:var(--muted)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.tab{background:none;border:1px solid var(--line);color:var(--muted);font:inherit;padding:6px 16px;border-radius:6px;cursor:pointer}
.tab[aria-selected=true]{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:700}
details{background:var(--panel);border:1px solid var(--line);border-radius:8px;margin-bottom:8px;padding:0 16px}
summary{cursor:pointer;padding:12px 0;font-weight:700}
details p{margin:0 0 14px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px}
.card b{display:block;font-size:18px}
.role{color:var(--teal);font-weight:700;font-size:14px}
.card span.d{color:var(--muted);font-size:14px}
.det .card b{color:var(--accent)}
.mark{display:block;mix-blend-mode:screen}
.logo{display:flex;align-items:center;gap:10px}
.logo .mark{width:40px;height:auto}
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:24px;align-items:center}
.hero .big{width:100%;max-width:380px;justify-self:center}
@media (max-width:720px){.hero{grid-template-columns:1fr}.hero .big{order:-1;max-width:220px}}
footer{max-width:1000px;margin:56px auto 0;padding:22px 20px 40px;border-top:1px solid var(--line);color:var(--muted);font-size:14px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>

<script>
/* ===== Edit data here / عدّل البيانات هنا ===== */
const CONFIG = {
  name: "",
  discord: "https://discord.gg/6Pq2HMwq",
  connect: "Soon"
};

const UI = {
  ar: {
    n_rules:"القوانين", n_staff:"الإدارة", n_det:"تفاصيل السيرفر", n_dc:"ديسكورد",
    tag:"",
    h_join:"انضم للديسكورد", h_rules:"اقرأ القوانين",

    s_h:"الإدارة", s_s:"لأي مشكلة افتح تذكرة في الديسكورد وسيرد عليك أحد الإداريين.",
    d_h:"تفاصيل السيرفر", d_s:"معلومات سريعة عن السيرفر وطريقة الدخول.",
    foot:"السيرفر غير تابع لـ Rockstar Games أو Take-Two.", btn:"English"
  },
  en: {
    n_rules:"Rules", n_staff:"Staff", n_det:"Server Info", n_dc:"Discord",
    tag:"An Arabic roleplay server built on QBX. A respectful community and real stories.",
    h_join:"Join our Discord", h_rules:"Read the rules",
    r_h:"Rules", r_s:"Not knowing the rules is no excuse. Read them before you join.",
    s_h:"Staff", s_s:"Having a problem? Open a ticket on Discord and a staff member will reply.",
    d_h:"Server Info", d_s:"Quick facts about the server and how to connect.",
    foot:"This server is not affiliated with Rockstar Games or Take-Two.", btn:"العربية"
  }
};

/* [title_ar, text_ar, title_en, text_en] */
const RULES = [
  {ar:"عامة", en:"General", items:[
    ["الاحترام","ممنوع السب والشتم والعنصرية داخل اللعبة أو الديسكورد.","Respect","No insults, swearing or racism in game or on Discord."],
    ["الغش والثغرات","أي استخدام لهاكات أو استغلال لثغرات يعرّضك للباند الدائم.","Cheating and exploits","Using hacks or abusing bugs results in a permanent ban."],
    ["الإعلان","ممنوع الإعلان عن سيرفرات أخرى.","Advertising","Advertising other servers is not allowed."]]},
  {ar:"الرول بلاي", en:"Roleplay", items:[
    ["Fail RP","كل تصرف يجب أن يكون واقعيًا ومناسبًا لشخصيتك.","Fail RP","Every action must be realistic and fit your character."],
    ["Meta Gaming","ممنوع استخدام معلومات من خارج اللعبة داخل الرول.","Meta Gaming","Do not use information from outside the game in your roleplay."],
    ["Power Gaming","ممنوع فرض أفعال على لاعب آخر دون إعطائه فرصة للرد.","Power Gaming","Do not force actions on another player without giving them a chance to respond."],
    ["New Life Rule (NLR)","بعد موتك تنسى كل ما حدث وتنتظر مدة قبل العودة لمكان الحادثة.","New Life Rule (NLR)","After you die, forget everything that happened and wait before returning to the scene."]]},
  {ar:"القتال", en:"Combat", items:[
    ["Random Deathmatch (RDM)","ممنوع القتل بدون سبب أو بدون رول مسبق.","Random Deathmatch (RDM)","No killing without a reason or prior roleplay."],
    ["Vehicle Deathmatch (VDM)","ممنوع الدهس المتعمد بدون سبب.","Vehicle Deathmatch (VDM)","No deliberately running people over without a reason."],
    ["Combat Logging","ممنوع الخروج من السيرفر أثناء المواجهة.","Combat Logging","Do not leave the server during a confrontation."]]},
  {ar:"الاقتصاد", en:"Economy", items:[
    ["تبادل الأموال","ممنوع بيع أو شراء أغراض اللعبة بأموال حقيقية.","Real-money trading","Buying or selling in-game items for real money is not allowed."],
    ["الدوبلكيشن","أي تكرار للأموال أو الأغراض بطريقة غير مشروعة يؤدي لحذف الحساب.","Duplication","Duplicating money or items illegitimately leads to account deletion."]]}
];


const STAFF = [
  ["Owners","Abo saddam _ MTR _ W6R","Owner","",""],
  ["DEVLOPER","AMRO_MOHAMMED","General Manager","",""],
  ["Support team","SOON","Moderator","",""],
];



const $ = id => document.getElementById(id);
const el = (t, c, txt) => { const e = document.createElement(t); if (c) e.className = c; if (txt) e.textContent = txt; return e; };
let lang = "ar", tab = 0;
try { const s = localStorage.getItem("lang"); if (s === "en" || s === "ar") lang = s; } catch (e) {}

function render() {
  const u = UI[lang], en = lang === "en", o = en ? 2 : 0;
  document.documentElement.lang = lang;
  document.documentElement.dir = en ? "ltr" : "rtl";
  document.title = CONFIG.name + " — FiveM";
  document.querySelectorAll("[data-i]").forEach(n => n.textContent = u[n.dataset.i]);
  $("logo").textContent = CONFIG.name;
  $("title").textContent = CONFIG.name;
  $("tag").textContent = u.tag;
  $("ip").textContent = CONFIG.connect;
  $("lang").textContent = u.btn;
  $("lang").lang = en ? "ar" : "en";
  $("dc1").href = $("dc2").href = CONFIG.discord;
  $("foot").textContent = "© " + new Date().getFullYear() + " " + CONFIG.name + ". " + u.foot;

  $("tabs").replaceChildren();
  RULES.forEach((c, i) => {
    const b = el("button", "tab", en ? c.en : c.ar);
    b.setAttribute("role", "tab"); b.setAttribute("aria-selected", i === tab);
    b.onclick = () => { tab = i; render(); };
    $("tabs").append(b);
  });
  $("rlist").replaceChildren();
  RULES[tab].items.forEach(r => {
    const d = el("details"); d.open = true;
    d.append(el("summary", "", r[o]), el("p", "", r[o + 1]));
    $("rlist").append(d);
  });
  $("sgrid").replaceChildren();
  STAFF.forEach(s => {
    const c = el("div", "card");
    c.append(el("b", "", s[0]), el("div", "role", en ? s[2] : s[1]), el("span", "d", en ? s[4] : s[3]));
    $("sgrid").append(c);
  });
  $("dgrid").replaceChildren();
  DETAILS.forEach(x => {
    const c = el("div", "card"); c.append(el("b", "", x[o]), el("span", "d", x[o + 1])); $("dgrid").append(c);
  });
}
$("lang").onclick = () => {
  lang = lang === "ar" ? "en" : "ar";
  try { localStorage.setItem("lang", lang); } catch (e) {}
  render();
};
render();
</script>
